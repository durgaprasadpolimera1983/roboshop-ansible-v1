
- name: Create EC2 instances and R53 records
  hosts: local
  connection: local

  vars:
    # ansible-playbook roboshop.yaml -e 'instances=["mongodb","redis"]'
    # ansible-playbook roboshop.yaml -e "action=delete"
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: devopsaws92s.shop
    ami_id: ami-0055977a6e828a4f4

  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
        state: present
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: Print EC2 creation output
      ansible.builtin.debug:
        var: ec2_output
